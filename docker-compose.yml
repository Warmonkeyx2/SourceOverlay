version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sos_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: source_overlay_studio
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sos_backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://user:password@postgres:5432/source_overlay_studio
      PORT: 4501
    ports:
      - '4501:4501'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sos_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4501
      NEXT_PUBLIC_WS_URL: ws://localhost:4501
    ports:
      - '4500:3000'
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
